<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Frota Renato - ITEL</title>
</head>
<body>
    <div class="card">
        <h2>Cadastro de Carros</h2>
        <form id="formCarro">
            <input type="text" id="marca" placeholder="Marca" required>
            <input type="text" id="modelo" placeholder="Modelo" required>
            <input type="number" id="ano" placeholder="Ano" required>
            <input type="text" id="cor" placeholder="Cor" required>
            <button type="submit">Salvar Carro</button>
        </form>
        <hr>
        <h3>Lista de Veículos</h3>
        <div id="lista"></div>
    </div>

    <script>
        const form = document.getElementById('formCarro');
        const listaDiv = document.getElementById('lista');

        async function carregar() {
            const res = await fetch('/carros');
            const carros = await res.json();
            listaDiv.innerHTML = carros.map(c => `
                <div class="carro-item">
                    <strong>${c.marca} ${c.modelo}</strong><br>
                    <small>Ano: ${c.ano} | Cor: ${c.cor}</small>
                </div>
            `).join('');
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                ano: document.getElementById('ano').value,
                cor: document.getElementById('cor').value
            };

            const res = await fetch('/carros', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                form.reset();
                carregar();
            } else {
                alert("Erro ao cadastrar. Verifique o terminal do VS Code.");
            }
        };

        carregar();
    </script>
</body>
</html>
