<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Frota Renato - ITEL</title>
</head>
<body>
    <div class="card">
        <h2>Cadastro de Carros</h2>
        <form id="carForm">
            <input type="hidden" id="carId">
            <input type="text" id="marca" placeholder="Marca" required>
            <input type="text" id="modelo" placeholder="Modelo" required>
            <input type="number" id="ano" placeholder="Ano" required>
            <input type="text" id="cor" placeholder="Cor" required>
            <div class="form-actions">
                <button type="submit" id="submitBtn">Salvar Carro</button>
                <button type="button" id="cancelBtn" hidden>Cancelar</button>
            </div>
        </form>
        <hr>
        <h3>Lista de Veículos</h3>
        <div id="listaCarros"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
